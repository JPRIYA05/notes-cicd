<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Student Notes Manager</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 12px; }
    input, textarea { width: 100%; padding: 8px; margin: 4px 0; box-sizing: border-box; }
    button { padding: 6px 14px; cursor: pointer; }
    .note { border: 1px solid #ccc; border-radius: 6px; padding: 10px; margin: 10px 0; }
    .row { display: flex; gap: 6px; }
  </style>
</head>
<body>
  <h1>Student Notes Manager</h1>
  <form action="/add" method="post">
    <input name="title" placeholder="Title" required>
    <textarea name="content" placeholder="Write your note..." required></textarea>
    <button type="submit">Add Note</button>
  </form>
  {% for n in notes %}
  <div class="note">
    <form action="/edit/{{ n.id }}" method="post">
      <input name="title" value="{{ n.title }}" required>
      <textarea name="content" required>{{ n.content }}</textarea>
      <div class="row">
        <button type="submit">Save</button>
        <button type="submit" formaction="/delete/{{ n.id }}">Delete</button>
      </div>
    </form>
  </div>
  {% endfor %}
</body>
</html>
